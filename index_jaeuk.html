<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>온앤온-임재욱</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div id="wrap">
            <header class="header">
                <div class="header-top">
                    <p>로그인 회원가입</p>
                    <img src="img/fb_icon.jpg" />
                    <img src="img/insta_icon.jpg" />
                </div>
                <div class="header-main">
                    <h1 class="logo"><img src="img/logo.jpg" /></h1>
                    <nav class="nav">nav</nav>
                </div>
            </header>

            <main class="contents01">
                <section class="content01">
                    <div class="a-left"><img src="img/img_01.jpg" src="" /></div>
                    <div class="a-right">
                        <div class="a-right1">
                            <div class="a-right1-1"><img src="img/img_02.jpg" /></div>
                            <div class="a-right1-2"><img src="img/img_03.jpg" /></div>
                        </div>
                        <div class="a-right2"><img src="img/img_04.jpg" /></div>
                        <div class="a-right3"><img src="img/img_05.jpg" /></div>
                    </div>
                </section>

                <section class="content02">
                    <div class="b-left"><img src="img/img_06.jpg" /></div>
                    <div class="b-right">
                        <div class="b-right1"><img src="img/img_07.jpg" /></div>
                        <div class="b-right2"><img src="img/img_08.jpg" /></div>
                    </div>
                </section>

                <section class="content03">
                    <div class="c-l">
                        <div class="c-top">
                            <div class="c-left">
                                <div class="c-left-top"><img src="img/img_09.jpg" /></div>
                                <div class="c-left-bottom"><img src="img/img_12.jpg" /></div>
                            </div>
                            <div class="c-right"><img src="img/img_10.jpg" /></div>
                        </div>
                        <div class="c-bottom"><img src="img/img13.jpg" /></div>
                    </div>
                    <div class="c-r"><img src="img/img_11.jpg" /></div>
                </section>
            </main>
        </div>

        <footer class="footer"></footer>
    </body>
</html>
